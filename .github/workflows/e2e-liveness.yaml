---
name: E2E IBFT Liveness Tests

# Long-running IBFT liveness / fault-recovery e2e tests. They boot real multi-node clusters and
# deliberately wait through partition windows, so they are too slow for the per-PR e2e job. They run
# nightly as part of the CI workflow (which drives this via workflow_call) and can be triggered
# manually on demand. Each scenario runs on its own runner (matrix) so total wall-clock is roughly
# the slowest single scenario rather than the sum of all of them.
on: # yamllint disable-line rule:truthy
  workflow_dispatch: {}

  workflow_call:
    outputs:
      workflow_output:
        description: E2E IBFT Liveness Tests output
        value: ${{ jobs.result.outputs.output_failure }}

# Static prefix (not github.workflow, which resolves to the caller) so this group can't collide
# with ci.yml's and cancel the parent run when invoked via workflow_call.
concurrency:
  group: e2e-ibft-liveness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e_ibft_liveness_test:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - TestIBFTLiveness_TwoValidators_OneDownStallsChain
          - TestIBFTLiveness_TwoValidators_OneDownKill9Recovers
          - TestIBFTLiveness_TwoValidators_LongPartitionRecovers
          - TestIBFTLiveness_MinorityValidatorRestart
          - TestIBFTLiveness_SixValidators_OneDownMajoritySeals
          - TestIBFTLiveness_SuperminorityPartitionRecovers
          - TestIBFTLiveness_DuplicateValidatorKeyHealthy
    env:
      E2E_TESTS: true
      E2E_LIVENESS_TESTS: true
      E2E_LOGS: true
      CI_VERBOSE: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Install Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod

      - name: Generate OpenSSL certificate
        run: openssl req -x509 -out localhost.crt -keyout localhost.key -newkey rsa:2048 -nodes -sha256 -subj '/CN=localhost' -extensions EXT -config <(printf "[dn]\nCN=localhost\n[req]\ndistinguished_name = dn\n[EXT]\nsubjectAltName=DNS:localhost\nkeyUsage=digitalSignature\nextendedKeyUsage=serverAuth")
      - name: Copy certificate key
        run: sudo cp localhost.key /etc/ssl/private/localhost.key
      - name: Copy certificate itself
        run: sudo cp localhost.crt /usr/local/share/ca-certificates/localhost.crt
      - name: Add certificate to trusted list
        run: sudo update-ca-certificates
      - name: Update certificate key folder permissions
        run: sudo chmod -R 755 /etc/ssl/private
      - name: Update certificate key file permissions
        run: sudo chmod 644 /etc/ssl/private/localhost.key
      - name: Check certificate key permissions
        run: ls -l /etc/ssl/private/localhost.key

      - name: Run liveness scenario
        # Anchored at the start with the full (mutually non-prefixing) test name, so this selects
        # exactly one scenario. A trailing `$` is intentionally omitted: make drops a literal `$`
        # from a command-line variable value, and it is unnecessary given the unique names.
        run: make test-e2e-liveness E2E_LIVENESS_RUN='^${{ matrix.scenario }}'

      - name: Archive test logs
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: e2e-liveness-logs-${{ matrix.scenario }}
          path: e2e-logs-*/
          retention-days: 30

  # Aggregate the matrix result into a single output so the CI Slack notification can report one
  # pass/fail status for the whole liveness suite. output_failure is "false" if any scenario failed
  # and empty (success) otherwise, matching the convention used by the other reusable workflows.
  result:
    name: E2E IBFT Liveness Result
    runs-on: ubuntu-slim
    needs: e2e_ibft_liveness_test
    if: always()
    outputs:
      output_failure: ${{ steps.aggregate.outputs.result }}
    steps:
      - name: Mark failure
        id: aggregate
        if: needs.e2e_ibft_liveness_test.result != 'success'
        run: echo "result=false" >> $GITHUB_OUTPUT
