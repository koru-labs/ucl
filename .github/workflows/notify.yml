---
name: notify

on:
  workflow_run:
    workflows: [integration]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  notify-pr-created:
    name: notify-pr-created
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - id: gate
        uses: koru-labs/pipeline_main/.github/actions/notify-after-pr-build-gate@main
        with:
          workflow_run_id: ${{ github.event.workflow_run.id }}

      - name: gate result
        if: always()
        shell: bash
        run: |
          echo "notify=${{ steps.gate.outputs.notify }}"
          echo "pr_url=${{ steps.gate.outputs.pr_url }}"

      - uses: koru-labs/pipeline_main/.github/actions/notify-slack-pr-created@main
        if: steps.gate.outputs.notify == 'true'
        with:
          webhook_url: ${{ secrets.SLACK_PR_WEBHOOK_URL }}
          pr_title: ${{ steps.gate.outputs.pr_title }}
          pr_url: ${{ steps.gate.outputs.pr_url }}
          pr_author: ${{ steps.gate.outputs.pr_author }}
          head_sha: ${{ steps.gate.outputs.head_sha }}
          head_commit_message: ${{ steps.gate.outputs.head_commit_message }}

      - uses: koru-labs/pipeline_main/.github/actions/request-codeowner-reviewers@main
        if: steps.gate.outputs.notify == 'true'
        continue-on-error: true
        with:
          pr_number: ${{ steps.gate.outputs.pr_number }}
          pr_author: ${{ steps.gate.outputs.pr_author }}
          head_sha: ${{ steps.gate.outputs.head_sha }}
