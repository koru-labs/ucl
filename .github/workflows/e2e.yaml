---
name: E2E IBFT Tests

on: # yamllint disable-line rule:truthy
  workflow_call:
    outputs:
      workflow_output:
        description: E2E IBFT Tests output
        value: ${{ jobs.e2e_ibft_test.outputs.output_failure }}

jobs:
  e2e_ibft_test:
    name: Run E2E IBFT Tests
    runs-on: ubuntu-latest
    env:
      E2E_TESTS: true
      E2E_LOGS: true
      CI_VERBOSE: true
    outputs:
      output_failure: ${{ steps.e2e_ibft_failure.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Install Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version: ${{ vars.GO_VERSION }}

      - name: Run tests
        run: make test-e2e

      - name: Run tests failed
        if: failure()
        id: e2e_ibft_failure
        run: echo "result=false" >> $GITHUB_OUTPUT

      - name: Archive test logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-logs
          path: e2e-logs-*/
          retention-days: 30
