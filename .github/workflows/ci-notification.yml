---
name: CI Notification

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      build_output:
        description: Build Polygon Edge output
        type: string
        required: true
      lint_output:
        description: Lint output
        type: string
        required: true
      unit_test_output:
        description: Unit Tests output
        type: string
        required: true
      fuzz_test_output:
        description: Fuzz Tests output
        type: string
        required: true
      e2e_ibft_test_output:
        description: E2E IBFT Tests output
        type: string
        required: true
      benchmark_test_output:
        description: Benchmark Tests output
        type: string
        required: true
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notification:
    name: Notification
    runs-on: ubuntu-slim
    steps:
      - name: Short SHA
        id: short_sha
        run: echo "value=`echo ${{ github.sha }} | cut -c1-7`" >> $GITHUB_OUTPUT
      - name: Notify Slack
        uses: slackapi/slack-github-action@v3.0.1
        env:
          succeed_bnt: "primary"
          failed_bnt: "danger"
          succeed_job: ":green:"
          failed_job: ":red:"
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Nightly CI"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Workflow Run"
                      },
                      "style": "${{ inputs.build_output == '' && inputs.lint_output == '' && inputs.unit_test_output == '' && inputs.fuzz_test_output == '' && inputs.e2e_ibft_test_output == '' && inputs.benchmark_test_output == '' && env.succeed_bnt || env.failed_bnt }}",
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Commit: *<https://github.com/${{ github.repository }}/tree/${{ github.sha }}|${{ steps.short_sha.outputs.value }}>*"
                    }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.build_output == '' && env.succeed_job || env.failed_job }} *Build*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.lint_output == '' && env.succeed_job || env.failed_job }} *Lint*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.unit_test_output == '' && env.succeed_job || env.failed_job }} *Unit Tests*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.fuzz_test_output == '' && env.succeed_job || env.failed_job }} *Fuzz Tests*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.e2e_ibft_test_output == '' && env.succeed_job || env.failed_job }} *E2E IBFT Tests*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.benchmark_test_output == '' && env.succeed_job || env.failed_job }} *Benchmark Tests*"
                    }
                  ]
                }
              ]
            }
