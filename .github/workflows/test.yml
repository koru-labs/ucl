---
name: Unit Tests
on:  # yamllint disable-line rule:truthy
  workflow_call:
    outputs:
      workflow_output:
        description: Unit tests output
        value: ${{ jobs.unit_test.outputs.output_failure }}

jobs:
  unit_test:
    name: Run Unit Tests
    # Pinned to 24.04 (Docker 28) on purpose. ubuntu-latest moved to 26.04 with
    # Docker 29, whose Engine API v1.52 dropped the deprecated top-level
    # NetworkSettings.IPAddress. The geth test server in Ethernal-Tech/ethgo
    # (testutil.DeployTestServer) reads exactly that field, so it builds the URL
    # "http://:8545" and every geth-backed test fails to connect. Unpin once the
    # helper reads NetworkSettings.Networks["bridge"].IPAddress instead.
    runs-on: ubuntu-24.04
    outputs:
      output_failure: ${{ steps.tests_failure.outputs.result }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod

      - name: Install Dependencies
        run: ./setup-ci.sh

      - name: Run Go Test
        run: make test

      - name: Run Go Test Failed
        if: failure()
        id: tests_failure
        run: echo "result=false" >> $GITHUB_OUTPUT
