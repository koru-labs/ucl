---
name: lint

on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch, tag, or SHA to build
        required: true
        default: main
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  resolve-trigger:
    name: resolve-trigger
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: koru-labs/pipeline_main/.github/actions/resolve-trigger@main
        with:
          event_name: ${{ github.event_name }}

  git-rebase:
    name: git-rebase
    needs: resolve-trigger
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.rebase.outputs.source_ref }}
    steps:
      - id: rebase
        uses: koru-labs/pipeline_main/.github/actions/git-rebase@main
        with:
          event_name: ${{ github.event_name }}
          dispatch_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}

  lint:
    name: lint
    needs: git-rebase
    runs-on: ubuntu-latest
    steps:
      - uses: koru-labs/pipeline_main/.github/actions/lint-golang@main
        with:
          source_ref: ${{ needs.git-rebase.outputs.source_ref }}
