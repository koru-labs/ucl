---
name: lint

# Manual dispatch only. Linting on pull requests is handled by ci.yml, which calls
# the reusable lint-golang.yml; keeping a pull_request trigger here as well would
# lint every PR twice. This workflow remains for running the pipeline_main
# lint-golang action against an arbitrary ref on demand.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch, tag, or SHA to build
        required: true
        default: main

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  resolve-trigger:
    name: resolve-trigger
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: koru-labs/pipeline_main_gh_public/.github/actions/resolve-trigger@main
        with:
          event_name: ${{ github.event_name }}

  git-rebase:
    name: git-rebase
    needs: resolve-trigger
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.rebase.outputs.source_ref }}
      source_branch: ${{ steps.rebase.outputs.source_branch }}
    steps:
      - id: rebase
        uses: koru-labs/pipeline_main_gh_public/.github/actions/git-rebase@main
        with:
          event_name: ${{ github.event_name }}
          dispatch_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}

  lint:
    name: lint
    needs: git-rebase
    runs-on: ubuntu-latest
    steps:
      - uses: koru-labs/pipeline_main_gh_public/.github/actions/lint-golang@main
        with:
          source_ref: ${{ needs.git-rebase.outputs.source_ref }}
