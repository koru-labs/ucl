syntax = "proto3";

package v1;

option go_package = "/syncer/proto";

import "google/protobuf/empty.proto";

service SyncPeer {
  // Returns stream of blocks beginning specified from
  rpc GetBlocks(GetBlocksRequest) returns (stream Block);
  // Returns server's status
  rpc GetStatus(google.protobuf.Empty) returns (SyncPeerStatus);
  // Returns stream of transactions from the tx pool
  rpc GetTxPool(google.protobuf.Empty) returns (stream Transactions);
  // Returns stream of receipts
  rpc GetReceipts(GetReceiptsRequest) returns (Receipts); 
}

// GetBlocksRequest is a request for GetBlocks
message GetBlocksRequest {
  // The height of beginning block to sync
  uint64 from = 1;
  bool is_validator = 2; // requester is a validator -> server skips receipts and BAL
}

// Block contains a block data
message Block {
  // RLP Encoded Block Data (Header, Transactions, Uncles)
  bytes block = 1;
  // RLP Encoded BlockAccessList (EIP-7928). Allows sync peers to apply
  // the finalized post-execution state directly, without re-executing
  // transactions through the EVM.
  bytes block_access_list = 2;
}

message GetReceiptsRequest {
    uint64 block_number = 1;
}

message Receipts {
    uint64 block_number = 1;
    bytes receipts = 2;
    bool received = 3;
}

// SyncPeerStatus contains peer status
message SyncPeerStatus {
  // Latest block height
  uint64 number = 1;
}

// Transactions contains RLP-encoded transactions
message Transactions {
  // RLP Encoded Transactions
  bytes txs = 1;
}
